# nginx for Advantage Pro LMS — serves the built SPA, proxies the API, and performs the
# X-Accel media hand-off. Referenced by docker-compose.prod.yml.
#
# TLS is intentionally not configured here: terminate it with certbot on the host or at a
# managed load balancer, then redirect :80 -> :443. Django additionally sets HSTS and
# secure cookies (config/settings/prod.py).

upstream lms_api {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads are capped in Django per kind (MAX_VIDEO_UPLOAD_MB / MAX_DOCUMENT_UPLOAD_MB);
    # keep this at or above the largest so nginx isn't the surprising failure.
    client_max_body_size 512M;

    # --- Security headers (see docs/DEPLOYMENT.md §4) -----------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Probes -------------------------------------------------------------------------
    # Two endpoints, two questions, and they must not be swapped:
    #   /api/v1/health/  liveness  — static. Is the process up? Restart it if not.
    #   /api/v1/ready/   readiness — checks the database and cache. Should it receive traffic?
    # Point an orchestrator's restart policy at health and its load-balancer rotation at
    # ready. Wiring restarts to readiness turns a brief database outage into a restart loop
    # across every container.
    #
    # Kept out of the access log: probes fire every few seconds and would otherwise bury the
    # real traffic.
    location = /api/v1/ready/ {
        access_log off;
        proxy_pass         http://lms_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /api/v1/health/ {
        access_log off;
        proxy_pass         http://lms_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # --- API ----------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://lms_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # prod.py trusts this header for SECURE_PROXY_SSL_HEADER — the edge must always set
        # it, never pass through a client-supplied value.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django admin: closed by default, because a commented-out allow-list protects nothing.
    # This block denies everything until someone edits in their own range — deliberately
    # failing closed, so forgetting this step locks the operator out rather than leaving the
    # admin open to the internet. The admin is the one surface where a stolen staff session
    # reaches the whole database at once.
    location /admin/ {
        allow 127.0.0.1;         # local troubleshooting from the host
        # allow 203.0.113.0/24;  # <- ADD your office / VPN range here
        deny all;
        proxy_pass       http://lms_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Protected media (X-Accel) ------------------------------------------------------
    # Never reachable directly: Django authorises the request, then returns
    # X-Accel-Redirect: /protected/<key> and nginx streams the bytes, freeing the worker.
    # Requires MEDIA_XACCEL_PREFIX=/protected in the app environment.
    location /protected/ {
        internal;
        alias /srv/lms/media/;
    }

    # --- SPA ----------------------------------------------------------------------------
    location /assets/ {
        alias /srv/lms/frontend/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /srv/lms/frontend;
        # Client-side routing: unknown paths fall back to the app shell.
        try_files $uri $uri/ /index.html;
    }
}
