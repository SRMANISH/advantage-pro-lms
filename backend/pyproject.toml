[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]

[tool.black]
line-length = 100
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# Tests are function-based; restrict class collection so Django models named Test* aren't collected.
python_classes = ["*Tests"]
# Coverage is opt-in (keeps the default run fast): `pytest --cov` uses the config below.
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/*",
    "*/apps.py",
    "loadtest/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
